<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה המיקום הבא של הצורות?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Circle LEFT, Triangle RIGHT -->
  <circle cx="110" cy="140" r="25" fill="none" stroke="#222" stroke-width="3"/>
  <polygon points="160,115 140,165 180,165" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Box 2: Triangle LEFT, Circle RIGHT -->
  <polygon points="290,115 270,165 310,165" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="340" cy="140" r="25" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Box 3: Circle LEFT, Triangle RIGHT -->
  <circle cx="470" cy="140" r="25" fill="none" stroke="#222" stroke-width="3"/>
  <polygon points="520,115 500,165 540,165" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הצורות מחליפות מקומות</text>
</svg>
