  <rect x="100" y="130" width="30" height="30" fill="#222"/>
  <rect x="140" y="130" width="30" height="30" fill="#222"/>
  <!-- Box2: 3 squares -->
  <rect x="280" y="90" width="30" height="30" fill="#222"/>
  <rect x="320" y="90" width="30" height="30" fill="#222"/>
  <rect x="300" y="130" width="30" height="30" fill="#222"/>
  <!-- Box3: 2 squares -->
  <rect x="465" y="110" width="30" height="30" fill="#222"/>
  <rect x="505" y="110" width="30" height="30" fill="#222"/>
  <!-- Box4: ? -->
  <text x="675" y="150" text-anchor="middle" font-size="60" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="230" x2="840" y2="230" stroke="#333" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">הכמות יורדת ב-1 בכל שלב</text>
