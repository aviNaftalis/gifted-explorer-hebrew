<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" dir="rtl">
  <rect width="900" height="280" fill="#fff"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#222">?לאיזה כיוון יצביע המשולש הבא</text>
  <g stroke="#333" stroke-width="3" fill="none">
    <rect x="60" y="55" width="150" height="150" rx="10"/>
    <rect x="240" y="55" width="150" height="150" rx="10"/>
    <rect x="420" y="55" width="150" height="150" rx="10"/>
    <rect x="600" y="55" width="150" height="150" rx="10"/>
  </g>
  <!-- Box1: triangle pointing UP ▲ -->
  <polygon points="135,85 170,165 100,165" fill="#222"/>
  <!-- Box2: triangle pointing RIGHT ► -->
  <polygon points="355,130 280,90 280,170" fill="#222"/>
  <!-- Box3: triangle pointing DOWN ▼ -->
  <polygon points="495,165 530,85 460,85" fill="#222"/>
  <!-- Box4: ? -->
  <text x="675" y="150" text-anchor="middle" font-size="60" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="230" x2="840" y2="230" stroke="#333" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">המשולש מסתובב 90° בכיוון השעון</text>
</svg>