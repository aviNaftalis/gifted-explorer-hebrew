<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה קודקודים לכוכב הבא?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: 3-pointed star -->
  <polygon points="135,100 120,165 155,125 115,125 150,165" fill="#222" stroke="none"/>
  <!-- Box 2: 4-pointed star -->
  <polygon points="315,100 323,130 350,140 323,150 315,180 307,150 280,140 307,130" fill="#222" stroke="none"/>
  <!-- Box 3: 5-pointed star -->
  <polygon points="495,102 503,130 533,130 509,148 517,176 495,160 473,176 481,148 457,130 487,130" fill="#222" stroke="none"/>
  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">מספר הקודקודים גדל בכל שלב</text>
</svg>