<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Matrix pattern puzzle">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה חסר בתוך המטריצה?</text>

  <!-- 3x3 Grid -->
  <g stroke="#333" stroke-width="3">
    <!-- Row 1 -->
    <rect x="200" y="60" width="100" height="100" fill="none"/>
    <rect x="300" y="60" width="100" height="100" fill="none"/>
    <rect x="400" y="60" width="100" height="100" fill="none"/>
    <!-- Row 2 -->
    <rect x="200" y="160" width="100" height="100" fill="none"/>
    <rect x="300" y="160" width="100" height="100" fill="none"/>
    <rect x="400" y="160" width="100" height="100" fill="none"/>
    <!-- Row 3 -->
    <rect x="200" y="260" width="100" height="100" fill="none"/>
    <rect x="300" y="260" width="100" height="100" fill="none"/>
    <rect x="400" y="260" width="100" height="100" fill="none"/>
  </g>

  <!-- Row 1: 1 circle, 2 circles, 3 circles -->
  <circle cx="250" cy="110" r="18" fill="#222"/>

  <circle cx="335" cy="95" r="14" fill="#222"/>
  <circle cx="365" cy="125" r="14" fill="#222"/>

  <circle cx="425" cy="85" r="12" fill="#222"/>
  <circle cx="450" cy="110" r="12" fill="#222"/>
  <circle cx="475" cy="135" r="12" fill="#222"/>

  <!-- Row 2: 1 square, 2 squares, 3 squares -->
  <rect x="235" y="195" width="30" height="30" fill="#222"/>

  <rect x="320" y="180" width="25" height="25" fill="#222"/>
  <rect x="355" y="215" width="25" height="25" fill="#222"/>

  <rect x="415" y="175" width="22" height="22" fill="#222"/>
  <rect x="440" y="200" width="22" height="22" fill="#222"/>
  <rect x="465" y="225" width="22" height="22" fill="#222"/>

  <!-- Row 3: 1 triangle, 2 triangles, ? -->
  <polygon points="250,295 265,325 235,325" fill="#222"/>

  <polygon points="335,280 348,305 322,305" fill="#222"/>
  <polygon points="365,310 378,335 352,335" fill="#222"/>

  <!-- Question mark in bottom-right cell -->
  <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#222">?</text>

  <!-- Divider -->
  <line x1="50" y1="375" x2="850" y2="375" stroke="#333" stroke-width="2"/>
</svg>
