  <g stroke="#333" stroke-width="3" fill="none">
    <rect x="60" y="55" width="150" height="150" rx="10"/>
    <rect x="240" y="55" width="150" height="150" rx="10"/>
    <rect x="420" y="55" width="150" height="150" rx="10"/>
