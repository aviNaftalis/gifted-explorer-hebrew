<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Folding pattern puzzle">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה הצורה הבאה ברצף?</text>

  <!-- Boxes -->
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: 1 dot -->
  <circle cx="135" cy="140" r="12" fill="#222"/>

  <!-- Box 2: 3 dots (triangle arrangement) -->
  <circle cx="315" cy="120" r="10" fill="#222"/>
  <circle cx="295" cy="155" r="10" fill="#222"/>
  <circle cx="335" cy="155" r="10" fill="#222"/>

  <!-- Box 3: 6 dots (triangle arrangement) -->
  <circle cx="495" cy="105" r="8" fill="#222"/>
  <circle cx="475" cy="130" r="8" fill="#222"/>
  <circle cx="515" cy="130" r="8" fill="#222"/>
  <circle cx="455" cy="155" r="8" fill="#222"/>
  <circle cx="495" cy="155" r="8" fill="#222"/>
  <circle cx="535" cy="155" r="8" fill="#222"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <!-- Divider -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>

  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">כמה נקודות צריכות להיות בצורה הבאה?</text>
</svg>
