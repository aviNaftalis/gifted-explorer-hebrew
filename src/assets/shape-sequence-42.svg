<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה נקודות בכל צד?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: domino left=1, right=2 -->
  <line x1="135" y1="75" x2="135" y2="205" stroke="#333" stroke-width="2"/>
  <circle cx="105" cy="140" r="7" fill="#222"/>
  <circle cx="160" cy="125" r="7" fill="#222"/>
  <circle cx="160" cy="155" r="7" fill="#222"/>

  <!-- Box 2: domino left=2, right=3 -->
  <line x1="315" y1="75" x2="315" y2="205" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="125" r="7" fill="#222"/>
  <circle cx="280" cy="155" r="7" fill="#222"/>
  <circle cx="345" cy="115" r="7" fill="#222"/>
  <circle cx="345" cy="140" r="7" fill="#222"/>
  <circle cx="345" cy="165" r="7" fill="#222"/>

  <!-- Box 3: domino left=3, right=4 -->
  <line x1="495" y1="75" x2="495" y2="205" stroke="#333" stroke-width="2"/>
  <circle cx="460" cy="115" r="7" fill="#222"/>
  <circle cx="460" cy="140" r="7" fill="#222"/>
  <circle cx="460" cy="165" r="7" fill="#222"/>
  <circle cx="515" cy="120" r="7" fill="#222"/>
  <circle cx="535" cy="120" r="7" fill="#222"/>
  <circle cx="515" cy="160" r="7" fill="#222"/>
  <circle cx="535" cy="160" r="7" fill="#222"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב מתווספת נקודה לכל צד</text>
</svg>
