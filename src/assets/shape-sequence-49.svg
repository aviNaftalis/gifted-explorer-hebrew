<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה הצורה הבאה ברצף?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Flag/L shape pointing RIGHT -->
  <!-- An angular flag: vertical bar on left, horizontal bar extending right from top -->
  <g stroke="#222" stroke-width="3" fill="none">
    <polyline points="110,100 110,180 110,180"/>
    <line x1="110" y1="100" x2="160" y2="100"/>
    <line x1="160" y1="100" x2="160" y2="140"/>
    <line x1="160" y1="140" x2="110" y2="140"/>
  </g>

  <!-- Box 2: Same shape MIRRORED (pointing LEFT) -->
  <g stroke="#222" stroke-width="3" fill="none">
    <polyline points="340,100 340,180"/>
    <line x1="340" y1="100" x2="290" y2="100"/>
    <line x1="290" y1="100" x2="290" y2="140"/>
    <line x1="290" y1="140" x2="340" y2="140"/>
  </g>

  <!-- Box 3: Shape pointing RIGHT again -->
  <g stroke="#222" stroke-width="3" fill="none">
    <polyline points="470,100 470,180"/>
    <line x1="470" y1="100" x2="520" y2="100"/>
    <line x1="520" y1="100" x2="520" y2="140"/>
    <line x1="520" y1="140" x2="470" y2="140"/>
  </g>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הצורה משתקפת בכל שלב</text>
</svg>
