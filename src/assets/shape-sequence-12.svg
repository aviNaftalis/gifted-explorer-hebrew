<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" dir="rtl">
  <rect width="900" height="280" fill="#fff"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#222">?כמה צורות בתא הבא</text>
  <g stroke="#333" stroke-width="3" fill="none">
    <rect x="60" y="55" width="150" height="150" rx="10"/>
    <rect x="240" y="55" width="150" height="150" rx="10"/>
    <rect x="420" y="55" width="150" height="150" rx="10"/>
    <rect x="600" y="55" width="150" height="150" rx="10"/>
  </g>
  <!-- Box1: 1 shape (triangle) -->
  <polygon points="135,95 160,155 110,155" fill="#222"/>
  <!-- Box2: 2 shapes (triangle + circle) -->
  <polygon points="295,90 315,130 275,130" fill="#222"/>
  <circle cx="330" cy="155" r="18" fill="#222"/>
  <!-- Box3: 3 shapes (triangle + circle + square) -->
  <polygon points="458,85 475,115 441,115" fill="#222"/>
  <circle cx="500" cy="105" r="15" fill="#222"/>
  <rect x="530" y="90" width="28" height="28" fill="#222"/>
  <!-- note: also show them in bottom row -->
  <text x="495" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">3 צורות</text>
  <!-- Box4: ? -->
  <text x="675" y="150" text-anchor="middle" font-size="60" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="230" x2="840" y2="230" stroke="#333" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">בכל שלב מתווספת צורה אחת</text>
</svg>