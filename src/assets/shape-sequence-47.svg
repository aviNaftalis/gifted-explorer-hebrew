<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה חלקים צבועים בעיגול?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Circle divided into 4, 1 quarter filled (top-right) -->
  <circle cx="135" cy="140" r="45" fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="135" y1="95" x2="135" y2="185" stroke="#222" stroke-width="2"/>
  <line x1="90" y1="140" x2="180" y2="140" stroke="#222" stroke-width="2"/>
  <path d="M135,140 L135,95 A45,45 0 0,1 180,140 Z" fill="#222"/>

  <!-- Box 2: Circle divided into 4, 2 quarters filled (top-right + top-left) -->
  <circle cx="315" cy="140" r="45" fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="315" y1="95" x2="315" y2="185" stroke="#222" stroke-width="2"/>
  <line x1="270" y1="140" x2="360" y2="140" stroke="#222" stroke-width="2"/>
  <path d="M315,140 L315,95 A45,45 0 0,1 360,140 Z" fill="#222"/>
  <path d="M315,140 L270,140 A45,45 0 0,1 315,95 Z" fill="#222"/>

  <!-- Box 3: Circle divided into 4, 3 quarters filled -->
  <circle cx="495" cy="140" r="45" fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="495" y1="95" x2="495" y2="185" stroke="#222" stroke-width="2"/>
  <line x1="450" y1="140" x2="540" y2="140" stroke="#222" stroke-width="2"/>
  <path d="M495,140 L495,95 A45,45 0 0,1 540,140 Z" fill="#222"/>
  <path d="M495,140 L450,140 A45,45 0 0,1 495,95 Z" fill="#222"/>
  <path d="M495,140 L495,185 A45,45 0 0,1 450,140 Z" fill="#222"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב נצבע חלק נוסף</text>
</svg>
