<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה משבצות צבועות בתא הבא?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: 2x2 grid, 1 cell filled (top-left) -->
  <rect x="105" y="110" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="135" y="110" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="105" y="140" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="135" y="140" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <!-- Box 2: 2x2 grid, 2 cells filled (top-left + top-right) -->
  <rect x="285" y="110" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="315" y="110" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="285" y="140" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="315" y="140" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <!-- Box 3: 2x2 grid, 3 cells filled -->
  <rect x="465" y="110" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="495" y="110" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="465" y="140" width="30" height="30" fill="#222" stroke="#222" stroke-width="2"/>
  <rect x="495" y="140" width="30" height="30" fill="none" stroke="#222" stroke-width="2"/>
  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב נצבעת משבצת נוספת</text>
</svg>