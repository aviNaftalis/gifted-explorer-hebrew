<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה נקודות חסרות בתא האחרון?</text>
  <g stroke="#333" stroke-width="3">
    <rect x="250" y="55" width="100" height="100" fill="none"/>
    <rect x="350" y="55" width="100" height="100" fill="none"/>
    <rect x="450" y="55" width="100" height="100" fill="none"/>
    <rect x="250" y="155" width="100" height="100" fill="none"/>
    <rect x="350" y="155" width="100" height="100" fill="none"/>
    <rect x="450" y="155" width="100" height="100" fill="none"/>
    <rect x="250" y="255" width="100" height="100" fill="none"/>
    <rect x="350" y="255" width="100" height="100" fill="none"/>
    <rect x="450" y="255" width="100" height="100" fill="none"/>
  </g>

  <!-- Row 1: 1 dot, 2 dots, 3 dots -->
  <!-- Cell (1,1): 1 dot at center (300,105) -->
  <circle cx="300" cy="105" r="6" fill="#222"/>

  <!-- Cell (1,2): 2 dots at (390,105) and (410,105) -->
  <circle cx="390" cy="105" r="6" fill="#222"/>
  <circle cx="410" cy="105" r="6" fill="#222"/>

  <!-- Cell (1,3): 3 dots in triangle -->
  <circle cx="500" cy="92" r="6" fill="#222"/>
  <circle cx="488" cy="115" r="6" fill="#222"/>
  <circle cx="512" cy="115" r="6" fill="#222"/>

  <!-- Row 2: 4 dots, 5 dots, 6 dots -->
  <!-- Cell (2,1): 4 dots in square -->
  <circle cx="288" cy="193" r="6" fill="#222"/>
  <circle cx="312" cy="193" r="6" fill="#222"/>
  <circle cx="288" cy="217" r="6" fill="#222"/>
  <circle cx="312" cy="217" r="6" fill="#222"/>

  <!-- Cell (2,2): 5 dots dice pattern -->
  <circle cx="385" cy="190" r="6" fill="#222"/>
  <circle cx="415" cy="190" r="6" fill="#222"/>
  <circle cx="400" cy="205" r="6" fill="#222"/>
  <circle cx="385" cy="220" r="6" fill="#222"/>
  <circle cx="415" cy="220" r="6" fill="#222"/>

  <!-- Cell (2,3): 6 dots in 2x3 -->
  <circle cx="485" cy="190" r="6" fill="#222"/>
  <circle cx="500" cy="190" r="6" fill="#222"/>
  <circle cx="515" cy="190" r="6" fill="#222"/>
  <circle cx="485" cy="220" r="6" fill="#222"/>
  <circle cx="500" cy="220" r="6" fill="#222"/>
  <circle cx="515" cy="220" r="6" fill="#222"/>

  <!-- Row 3: 7 dots, 8 dots, ? -->
  <!-- Cell (3,1): 7 dots - 3+1+3 arrangement -->
  <circle cx="285" cy="290" r="6" fill="#222"/>
  <circle cx="300" cy="290" r="6" fill="#222"/>
  <circle cx="315" cy="290" r="6" fill="#222"/>
  <circle cx="300" cy="305" r="6" fill="#222"/>
  <circle cx="285" cy="320" r="6" fill="#222"/>
  <circle cx="300" cy="320" r="6" fill="#222"/>
  <circle cx="315" cy="320" r="6" fill="#222"/>

  <!-- Cell (3,2): 8 dots - 3+2+3 arrangement -->
  <circle cx="385" cy="290" r="6" fill="#222"/>
  <circle cx="400" cy="290" r="6" fill="#222"/>
  <circle cx="415" cy="290" r="6" fill="#222"/>
  <circle cx="392" cy="305" r="6" fill="#222"/>
  <circle cx="408" cy="305" r="6" fill="#222"/>
  <circle cx="385" cy="320" r="6" fill="#222"/>
  <circle cx="400" cy="320" r="6" fill="#222"/>
  <circle cx="415" cy="320" r="6" fill="#222"/>

  <!-- Cell (3,3): ? -->
  <text x="500" y="320" text-anchor="middle" font-size="50" font-weight="700" fill="#222">?</text>
</svg>
