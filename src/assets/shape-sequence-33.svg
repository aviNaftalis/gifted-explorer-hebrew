<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה הצורה הבאה ברצף?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: Plus sign (+) -->
  <rect x="125" y="120" width="20" height="40" stroke="#222" stroke-width="2.5" fill="#222"/>
  <rect x="115" y="130" width="40" height="20" stroke="#222" stroke-width="2.5" fill="#222"/>
  <!-- Box 2: X sign (45° rotated plus) -->
  <g transform="translate(315,140) rotate(45)">
    <rect x="-10" y="-20" width="20" height="40" stroke="#222" stroke-width="2.5" fill="#222"/>
    <rect x="-20" y="-10" width="40" height="20" stroke="#222" stroke-width="2.5" fill="#222"/>
  </g>
  <!-- Box 3: Plus sign (+) again -->
  <rect x="485" y="120" width="20" height="40" stroke="#222" stroke-width="2.5" fill="#222"/>
  <rect x="475" y="130" width="40" height="20" stroke="#222" stroke-width="2.5" fill="#222"/>
  <!-- Box 4: Question mark -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הצורה מסתובבת 45 מעלות</text>
</svg>