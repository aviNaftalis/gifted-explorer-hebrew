<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Shape rotation puzzle">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#222">איזו צורה משלימה את הרצף?</text>

  <!-- Boxes -->
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="50" y="70" width="160" height="160" rx="12"/>
    <rect x="240" y="70" width="160" height="160" rx="12"/>
    <rect x="430" y="70" width="160" height="160" rx="12"/>
    <rect x="620" y="70" width="160" height="160" rx="12"/>
  </g>

  <!-- Arrow pointing UP -->
  <g transform="translate(130,150)">
    <line x1="0" y1="30" x2="0" y2="-30" stroke="#222" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,-40 -15,-20 15,-20" fill="#222"/>
  </g>

  <!-- Arrow pointing RIGHT -->
  <g transform="translate(320,150)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#222" stroke-width="8" stroke-linecap="round"/>
    <polygon points="40,0 20,-15 20,15" fill="#222"/>
  </g>

  <!-- Arrow pointing DOWN -->
  <g transform="translate(510,150)">
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#222" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,40 -15,20 15,20" fill="#222"/>
  </g>

  <!-- Question mark -->
  <text x="700" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#222">?</text>

  <!-- Divider -->
  <line x1="50" y1="260" x2="850" y2="260" stroke="#333" stroke-width="3"/>

  <!-- Answer options labels -->
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#444">בחר/י את התשובה הנכונה</text>
</svg>
