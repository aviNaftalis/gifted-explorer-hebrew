<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">איפה תהיה הנקודה?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Square with dot at top-left -->
  <rect x="100" y="100" width="70" height="70" stroke="#222" stroke-width="2.5" fill="none"/>
  <circle cx="105" cy="105" r="8" fill="#222"/>

  <!-- Box 2: Square with dot at top-right -->
  <rect x="280" y="100" width="70" height="70" stroke="#222" stroke-width="2.5" fill="none"/>
  <circle cx="345" cy="105" r="8" fill="#222"/>

  <!-- Box 3: Square with dot at bottom-right -->
  <rect x="460" y="100" width="70" height="70" stroke="#222" stroke-width="2.5" fill="none"/>
  <circle cx="525" cy="165" r="8" fill="#222"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הנקודה זזה בכיוון השעון</text>
</svg>
