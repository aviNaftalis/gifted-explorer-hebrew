<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה חסר בתא האחרון?</text>
  <g stroke="#333" stroke-width="3">
    <rect x="250" y="55" width="100" height="100" fill="none"/>
    <rect x="350" y="55" width="100" height="100" fill="none"/>
    <rect x="450" y="55" width="100" height="100" fill="none"/>
    <rect x="250" y="155" width="100" height="100" fill="none"/>
    <rect x="350" y="155" width="100" height="100" fill="none"/>
    <rect x="450" y="155" width="100" height="100" fill="none"/>
    <rect x="250" y="255" width="100" height="100" fill="none"/>
    <rect x="350" y="255" width="100" height="100" fill="none"/>
    <rect x="450" y="255" width="100" height="100" fill="none"/>
  </g>

  <!-- Row 1: 1 circle, 1 triangle, 1 square -->
  <!-- (300,105): 1 circle -->
  <circle cx="300" cy="105" r="18" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (400,105): 1 triangle -->
  <polygon points="400,85 382,122 418,122" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (500,105): 1 square -->
  <rect x="482" y="87" width="36" height="36" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- Row 2: 2 circles, 2 triangles, 2 squares -->
  <!-- (300,205): 2 circles -->
  <circle cx="285" cy="198" r="14" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="315" cy="212" r="14" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (400,205): 2 triangles -->
  <polygon points="387,193 377,213 397,213" fill="none" stroke="#222" stroke-width="2.5"/>
  <polygon points="413,197 403,217 423,217" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (500,205): 2 squares -->
  <rect x="478" y="190" width="20" height="20" fill="none" stroke="#222" stroke-width="2.5"/>
  <rect x="502" y="200" width="20" height="20" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- Row 3: 3 circles, 3 triangles, ? -->
  <!-- (300,305): 3 circles -->
  <circle cx="285" cy="293" r="13" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="315" cy="293" r="13" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="300" cy="317" r="13" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (400,305): 3 triangles -->
  <polygon points="385,290 376,307 394,307" fill="none" stroke="#222" stroke-width="2.5"/>
  <polygon points="415,290 406,307 424,307" fill="none" stroke="#222" stroke-width="2.5"/>
  <polygon points="400,308 391,325 409,325" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- (500,305): ? -->
  <text x="500" y="320" text-anchor="middle" font-size="50" font-weight="700" fill="#222">?</text>
</svg>
