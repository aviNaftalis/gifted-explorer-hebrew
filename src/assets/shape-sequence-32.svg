<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה ריבועים בצורה הבאה?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: 1 square (50x50) -->
  <rect x="110" y="115" width="50" height="50" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Box 2: 2 nested squares -->
  <rect x="287.5" y="112.5" width="55" height="55" stroke="#222" stroke-width="2.5" fill="none"/>
  <rect x="300" y="125" width="30" height="30" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Box 3: 3 nested squares -->
  <rect x="466" y="111" width="58" height="58" stroke="#222" stroke-width="2.5" fill="none"/>
  <rect x="477" y="122" width="36" height="36" stroke="#222" stroke-width="2.5" fill="none"/>
  <rect x="486" y="131" width="18" height="18" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Box 4: Question mark -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב מתווסף ריבוע</text>
</svg>