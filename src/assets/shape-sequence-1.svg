<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Shape sequence puzzle">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#111111">איזו צורה משלימה את הרצף?</text>

  <g stroke="#111111" stroke-width="6" fill="none">
    <rect x="120" y="130" width="210" height="210" rx="16"/>
    <rect x="370" y="130" width="210" height="210" rx="16"/>
    <rect x="620" y="130" width="210" height="210" rx="16"/>
    <rect x="870" y="130" width="210" height="210" rx="16"/>
  </g>

  <!-- Triangle -->
  <polygon points="225,178 285,290 165,290" fill="none" stroke="#111111" stroke-width="10"/>

  <!-- Square -->
  <rect x="432" y="185" width="90" height="90" fill="none" stroke="#111111" stroke-width="10"/>

  <!-- Pentagon -->
  <polygon points="725,175 775,210 756,268 694,268 675,210" fill="none" stroke="#111111" stroke-width="10"/>

  <!-- Question mark -->
  <text x="975" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="#111111">?</text>

  <line x1="120" y1="390" x2="1080" y2="390" stroke="#111111" stroke-width="5"/>

  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#111111">האפשרויות למטה הן תשובות הצורות</text>
</svg>
