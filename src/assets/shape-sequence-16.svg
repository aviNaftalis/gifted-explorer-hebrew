<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" dir="rtl">
  <rect width="900" height="300" fill="#fff"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#222">?כמה נקודות בתא הבא</text>
  <g stroke="#333" stroke-width="3" fill="none">
    <rect x="60" y="55" width="150" height="170" rx="10"/>
    <rect x="240" y="55" width="150" height="170" rx="10"/>
    <rect x="420" y="55" width="150" height="170" rx="10"/>
    <rect x="600" y="55" width="150" height="170" rx="10"/>
  </g>
  <!-- Box1: 1 dot -->
  <circle cx="135" cy="140" r="10" fill="#222"/>
  <!-- Box2: 2 dots -->
  <circle cx="300" cy="140" r="10" fill="#222"/>
  <circle cx="340" cy="140" r="10" fill="#222"/>
  <!-- Box3: 4 dots (2x2) -->
  <circle cx="475" cy="115" r="9" fill="#222"/>
  <circle cx="515" cy="115" r="9" fill="#222"/>
  <circle cx="475" cy="155" r="9" fill="#222"/>
  <circle cx="515" cy="155" r="9" fill="#222"/>
  <!-- Box4: ? -->
  <text x="675" y="160" text-anchor="middle" font-size="60" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="2"/>
  <text x="450" y="280" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">הכמות מוכפלת בכל שלב: 1, 2, 4, ...?</text>
</svg>