<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה פסגות בצורה הבאה?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: 1 peak (V shape) -->
  <polyline points="100,120 135,165 170,120" fill="none" stroke="#222" stroke-width="4"/>
  <!-- Box 2: 2 peaks -->
  <polyline points="260,120 280,160 300,120 320,160 340,120" fill="none" stroke="#222" stroke-width="4"/>
  <!-- Box 3: 3 peaks -->
  <polyline points="440,120 456,160 472,120 488,160 504,120 520,160 536,120" fill="none" stroke="#222" stroke-width="4"/>
  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הזיגזג גדל בכל שלב</text>
</svg>