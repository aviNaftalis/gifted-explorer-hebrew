<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה קווים בעיגול הבא?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: Circle only, no stripes -->
  <circle cx="135" cy="140" r="35" stroke="#222" stroke-width="3" fill="none"/>
  <!-- Box 2: Circle with 1 horizontal line -->
  <circle cx="315" cy="140" r="35" stroke="#222" stroke-width="3" fill="none"/>
  <line x1="280" y1="140" x2="350" y2="140" stroke="#222" stroke-width="2.5"/>
  <!-- Box 3: Circle with 2 horizontal lines -->
  <circle cx="495" cy="140" r="35" stroke="#222" stroke-width="3" fill="none"/>
  <clipPath id="clip3">
    <circle cx="495" cy="140" r="34"/>
  </clipPath>
  <line x1="460" y1="128" x2="530" y2="128" stroke="#222" stroke-width="2.5" clip-path="url(#clip3)"/>
  <line x1="460" y1="152" x2="530" y2="152" stroke="#222" stroke-width="2.5" clip-path="url(#clip3)"/>
  <!-- Box 4: Question mark -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב מתווסף קו</text>
</svg>