<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה חסר בתא האחרון?</text>
  <g stroke="#333" stroke-width="3">
    <rect x="250" y="55" width="100" height="100" fill="none"/>
    <rect x="350" y="55" width="100" height="100" fill="none"/>
    <rect x="450" y="55" width="100" height="100" fill="none"/>
    <rect x="250" y="155" width="100" height="100" fill="none"/>
    <rect x="350" y="155" width="100" height="100" fill="none"/>
    <rect x="450" y="155" width="100" height="100" fill="none"/>
    <rect x="250" y="255" width="100" height="100" fill="none"/>
    <rect x="350" y="255" width="100" height="100" fill="none"/>
    <rect x="450" y="255" width="100" height="100" fill="none"/>
  </g>
  <!-- Row 1: big circle, medium circle, small circle -->
  <circle cx="300" cy="105" r="28" stroke="#222" stroke-width="2.5" fill="none"/>
  <circle cx="400" cy="105" r="20" stroke="#222" stroke-width="2.5" fill="none"/>
  <circle cx="500" cy="105" r="12" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Row 2: big square, medium square, small square -->
  <rect x="275" y="180" width="50" height="50" stroke="#222" stroke-width="2.5" fill="none"/>
  <rect x="382" y="187" width="36" height="36" stroke="#222" stroke-width="2.5" fill="none"/>
  <rect x="489" y="194" width="22" height="22" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Row 3: big triangle, medium triangle, ? -->
  <polygon points="300,280 325,330 275,330" stroke="#222" stroke-width="2.5" fill="none"/>
  <polygon points="400,288 418,325 382,325" stroke="#222" stroke-width="2.5" fill="none"/>
  <!-- Cell (3,3): Question mark -->
  <text x="500" y="320" text-anchor="middle" font-size="50" font-weight="700" fill="#222">?</text>
  <line x1="50" y1="375" x2="850" y2="375" stroke="#333" stroke-width="2"/>
</svg>