<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Shading pattern puzzle">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">מה חסר ברצף?</text>

  <!-- Boxes -->
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Square divided in 4, top-left filled -->
  <g transform="translate(95,100)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="#222" stroke-width="3"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#222" stroke-width="3"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#222" stroke-width="3"/>
    <rect x="0" y="0" width="40" height="40" fill="#222"/>
  </g>

  <!-- Box 2: Square divided in 4, top-right filled -->
  <g transform="translate(275,100)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="#222" stroke-width="3"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#222" stroke-width="3"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#222" stroke-width="3"/>
    <rect x="40" y="0" width="40" height="40" fill="#222"/>
  </g>

  <!-- Box 3: Square divided in 4, bottom-right filled -->
  <g transform="translate(455,100)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="#222" stroke-width="3"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#222" stroke-width="3"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#222" stroke-width="3"/>
    <rect x="40" y="40" width="40" height="40" fill="#222"/>
  </g>

  <!-- Box 4: Question mark -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <!-- Divider -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>

  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">הריבוע השחור מסתובב. לאן הוא ילך עכשיו?</text>
</svg>
