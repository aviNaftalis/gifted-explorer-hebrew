<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" dir="rtl">
  <rect width="900" height="280" fill="#fff"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#222">?איזה חצי עיגול ממשיך את הרצף</text>
  <g stroke="#333" stroke-width="3" fill="none">
    <rect x="60" y="55" width="150" height="150" rx="10"/>
    <rect x="240" y="55" width="150" height="150" rx="10"/>
    <rect x="420" y="55" width="150" height="150" rx="10"/>
    <rect x="600" y="55" width="150" height="150" rx="10"/>
  </g>
  <!-- Box1: right half filled -->
  <circle cx="135" cy="130" r="40" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M135,90 A40,40 0 0,1 135,170 Z" fill="#222"/>
  <!-- Box2: bottom half filled -->
  <circle cx="315" cy="130" r="40" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M275,130 A40,40 0 0,1 355,130 Z" fill="#222" transform="rotate(180,315,130)"/>
  <!-- Box3: left half filled -->
  <circle cx="495" cy="130" r="40" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M495,90 A40,40 0 0,0 495,170 Z" fill="#222"/>
  <!-- Box4: ? -->
  <text x="675" y="150" text-anchor="middle" font-size="60" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="230" x2="840" y2="230" stroke="#333" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#444">החצי המלא מסתובב 90° בכיוון השעון</text>
</svg>