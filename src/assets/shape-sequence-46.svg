<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה קווים בתוך המשולש?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>

  <!-- Box 1: Plain triangle, no internal lines -->
  <polygon points="135,90 90,190 180,190" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Box 2: Triangle with 1 horizontal line (2 sections) -->
  <polygon points="315,90 270,190 360,190" fill="none" stroke="#222" stroke-width="3"/>
  <line x1="292" y1="140" x2="338" y2="140" stroke="#222" stroke-width="2"/>

  <!-- Box 3: Triangle with 2 horizontal lines (3 sections) -->
  <polygon points="495,90 450,190 540,190" fill="none" stroke="#222" stroke-width="3"/>
  <line x1="480" y1="123" x2="510" y2="123" stroke="#222" stroke-width="2"/>
  <line x1="465" y1="156" x2="525" y2="156" stroke="#222" stroke-width="2"/>

  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב מתווסף קו בתוך המשולש</text>
</svg>
