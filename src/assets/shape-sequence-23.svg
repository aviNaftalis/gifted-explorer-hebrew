<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">כמה שורות בתא הבא?</text>
  <g stroke="#333" stroke-width="4" fill="none">
    <rect x="60" y="65" width="150" height="150" rx="12"/>
    <rect x="240" y="65" width="150" height="150" rx="12"/>
    <rect x="420" y="65" width="150" height="150" rx="12"/>
    <rect x="600" y="65" width="150" height="150" rx="12"/>
  </g>
  <!-- Box 1: 1 horizontal bar at bottom -->
  <rect x="95" y="160" width="80" height="10" fill="#222" stroke="none"/>
  <!-- Box 2: 2 horizontal bars stacked -->
  <rect x="275" y="148" width="80" height="10" fill="#222" stroke="none"/>
  <rect x="275" y="168" width="80" height="10" fill="#222" stroke="none"/>
  <!-- Box 3: 3 horizontal bars stacked -->
  <rect x="455" y="118" width="80" height="10" fill="#222" stroke="none"/>
  <rect x="455" y="140" width="80" height="10" fill="#222" stroke="none"/>
  <rect x="455" y="162" width="80" height="10" fill="#222" stroke="none"/>
  <!-- Box 4: ? -->
  <text x="675" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#222">?</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#333" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#444">בכל שלב מתווספת שורה</text>
</svg>